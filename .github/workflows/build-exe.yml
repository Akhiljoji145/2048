
name: Build 2048 Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build desktop EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name 2048-Desktop main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 2048-Windows-EXE
          path: dist/2048-Desktop.exe
          if-no-files-found: error
          retention-days: 14
